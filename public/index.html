<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>Invite Board</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237c3aed'/><circle cx='50' cy='50' r='18' fill='white'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app. The config lives in
       tailwind.config.js; npm run build compiles it to public/tailwind.css on
       every image build, so the stylesheet always matches this commit's
       markup. Class names must be written as whole literals. -->
  <link rel="stylesheet" href="/tailwind.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path.
       It is NOT conditional on calling a bridge API: it is also how the app
       ANSWERS the shell, and it reports this document's dark ground
       (bg-zinc-950) so the platform bar above the app takes the app's tone. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  <main class="max-w-md mx-auto px-4 pt-8 pb-28 flex flex-col gap-5">

    <header>
      <h1 class="text-2xl font-bold tracking-tight">Invite Board</h1>
      <p class="text-sm text-zinc-500 mt-1">See who brought whom here, and share your own links.</p>
    </header>

    <!-- Tab switch: two views, no animation on this high-frequency control. -->
    <nav id="tabs" class="grid grid-cols-2 gap-1 rounded-xl bg-zinc-900 border border-zinc-800 p-1" aria-label="Sections">
      <button id="tab-leaderboard" type="button"
        class="rounded-lg px-3 py-2 text-sm font-semibold bg-zinc-800 text-zinc-100">Leaderboard</button>
      <button id="tab-mine" type="button"
        class="rounded-lg px-3 py-2 text-sm font-semibold text-zinc-500">My invites</button>
    </nav>

    <!-- Leaderboard: ranked inviters, each card lists their links with join counts. -->
    <section id="view-leaderboard" class="flex flex-col gap-3" aria-label="Leaderboard">
      <p class="text-sm text-zinc-500">Loading…</p>
    </section>

    <!-- My invites: the signed-in user's links with uses left. -->
    <section id="view-mine" class="flex flex-col gap-3 hidden" aria-label="My invites">
      <p class="text-sm text-zinc-500">Loading…</p>
    </section>

  </main>

  <!-- One-hand create button -->
  <button id="fab" type="button" aria-label="Create invite link"
    class="fixed right-4 z-30 w-14 h-14 rounded-full bg-violet-600 hover:bg-violet-500 active:scale-95 transition-transform text-white text-3xl leading-none shadow-lg shadow-violet-600/30 flex items-center justify-center pb-1"
    style="bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));">+</button>

  <!-- Create-link sheet -->
  <div id="overlay" class="fixed inset-0 z-40 hidden">
    <div class="absolute inset-0 bg-black/60" data-close></div>
    <div class="absolute inset-x-0 bottom-0 mx-auto max-w-md p-4"
      style="padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px));">
      <div class="rounded-2xl border border-zinc-800 bg-zinc-900 p-5 flex flex-col gap-4">
        <div class="flex items-center justify-between">
          <h2 class="text-lg font-semibold">Create invite link</h2>
          <button type="button" data-close aria-label="Close"
            class="w-8 h-8 rounded-full text-zinc-400 hover:text-zinc-200 text-xl leading-none">✕</button>
        </div>
        <form id="create-form" class="flex flex-col gap-4" novalidate>
          <div>
            <label for="f-days" class="block text-sm font-medium text-zinc-300 mb-1">Expires in (days)</label>
            <input id="f-days" name="days" type="number" inputmode="numeric" min="1" max="365"
              placeholder="Never expires"
              class="w-full rounded-xl bg-zinc-950 border border-zinc-800 px-3 py-2.5 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-violet-500">
          </div>
          <div>
            <label for="f-uses" class="block text-sm font-medium text-zinc-300 mb-1">Max uses</label>
            <input id="f-uses" name="maxUses" type="number" inputmode="numeric" min="1" max="9999"
              placeholder="Unlimited"
              class="w-full rounded-xl bg-zinc-950 border border-zinc-800 px-3 py-2.5 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-violet-500">
          </div>
          <p id="form-error" class="text-sm text-red-400 hidden"></p>
          <button type="submit" id="create-btn"
            class="w-full rounded-xl bg-violet-600 hover:bg-violet-500 text-white font-semibold py-3 text-sm">Create link</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" role="status"
    class="fixed left-1/2 -translate-x-1/2 z-50 hidden rounded-full bg-zinc-800 text-zinc-100 text-sm px-4 py-2 border border-zinc-700 shadow-lg whitespace-nowrap max-w-[90vw] overflow-hidden text-ellipsis"
    style="bottom: calc(5.5rem + env(safe-area-inset-bottom, 0px));"></div>

  <script>
    (function () {
      'use strict';

      var params = new URLSearchParams(window.location.search);
      var token = params.get('token') || '';
      var headers = Object.assign({'Content-Type': 'application/json'},
        token ? {'x-usernode-token': token} : {});

      var $ = function (id) { return document.getElementById(id); };
      var esc = function (s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
        });
      };

      // ------------------------------------------------------------- toast
      var toastTimer = null;
      function toast(msg) {
        var el = $('toast');
        el.textContent = msg;
        el.classList.remove('hidden');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { el.classList.add('hidden'); }, 2600);
      }

      // -------------------------------------------------------------- tabs
      var tab = params.get('tab') === 'mine' ? 'mine' : 'leaderboard';
      var mineLinks = null;
      var mineTicker = null;
      function showTab(next) {
        tab = next;
        $('view-leaderboard').classList.toggle('hidden', tab !== 'leaderboard');
        $('view-mine').classList.toggle('hidden', tab !== 'mine');
        var on = 'rounded-lg px-3 py-2 text-sm font-semibold bg-zinc-800 text-zinc-100';
        var off = 'rounded-lg px-3 py-2 text-sm font-semibold text-zinc-500';
        $('tab-leaderboard').className = tab === 'leaderboard' ? on : off;
        $('tab-mine').className = tab === 'mine' ? on : off;
        // Keep the URL shareable without pinning transient UI state.
        params.delete('tab'); params.delete('create');
        if (tab === 'mine') params.set('tab', 'mine');
        history.replaceState(null, '', location.pathname + (params.toString() ? '?' + params : ''));
        if (tab === 'mine') startMineTicker();
        else stopMineTicker();
      }
      $('tab-leaderboard').addEventListener('click', function () { showTab('leaderboard'); });
      $('tab-mine').addEventListener('click', function () { showTab('mine'); });

      // ------------------------------------------------------------ helpers
      function daysLeft(iso) {
        if (!iso) return null;
        return Math.ceil((new Date(iso).getTime() - Date.now()) / 86400000);
      }
      function expiryText(link) {
        if (!link.expiresAt) return 'Never expires';
        var ms = new Date(link.expiresAt).getTime() - Date.now();
        if (ms <= 0) return 'Expired';
        var d = Math.floor(ms / 86400000);
        var h = Math.floor((ms % 86400000) / 3600000);
        if (d > 0) return 'expires in ' + d + (h ? 'd ' + h + 'h' : 'd');
        if (h > 0) return 'expires in ' + h + 'h';
        return 'expires in ' + Math.max(1, Math.floor(ms / 60000)) + 'm';
      }
      function usesText(link) {
        if (link.maxUses == null) return 'Unlimited uses';
        var left = Math.max(0, link.maxUses - link.joins);
        return left + (left === 1 ? ' use left' : ' uses left');
      }
      function shareUrl(link) {
        return location.origin + '/?invite=' + encodeURIComponent(link.code);
      }
      function copyLink(link) {
        var url = shareUrl(link);
        function done() { toast('Link copied'); }
        function fallback() {
          var ta = document.createElement('textarea');
          ta.value = url;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); done(); }
          catch (e) { toast('Copy failed. Long-press the link code instead.'); }
          document.body.removeChild(ta);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(done, fallback);
        } else fallback();
      }

      function errorState(section, retry) {
        $(section).innerHTML =
          '<div class="rounded-2xl border border-zinc-800 bg-zinc-900/60 p-6 text-center flex flex-col gap-3">' +
          '<p class="text-sm text-zinc-300">Could not load. Check your connection.</p>' +
          '<button type="button" class="self-center rounded-xl bg-violet-600 text-white font-semibold px-4 py-2 text-sm" data-retry="' + retry + '">Try again</button>' +
          '</div>';
      }

      // -------------------------------------------------------- leaderboard
      function renderLeaderboard(inviters) {
        var el = $('view-leaderboard');
        if (!inviters.length) {
          el.innerHTML =
            '<div class="rounded-2xl border border-zinc-800 bg-zinc-900/60 p-6 text-center flex flex-col gap-3">' +
            '<p class="font-semibold text-zinc-100">No invites yet</p>' +
            '<p class="text-sm text-zinc-400">Be the first to invite someone here.</p>' +
            '<button type="button" class="self-center rounded-xl bg-violet-600 hover:bg-violet-500 text-white font-semibold px-4 py-2 text-sm" data-open-create>Create invite link</button>' +
            '</div>';
          return;
        }
        var html = '';
        inviters.forEach(function (inv, i) {
          var rank = '<span class="w-7 h-7 shrink-0 rounded-full flex items-center justify-center text-xs font-bold tabular-nums ' +
            (i < 3 ? 'bg-violet-600/20 text-violet-300' : 'bg-zinc-800 text-zinc-400') + '">' + (i + 1) + '</span>';
          var links = inv.links.map(function (link) {
            var who = link.invitees.length
              ? '<p class="text-xs text-zinc-600 mt-0.5">invited ' + link.invitees.map(function (n) { return '@' + esc(n); }).join(', ') + '</p>'
              : '';
            return '<div class="pt-2.5 mt-2.5 border-t border-zinc-800/80">' +
              '<div class="flex items-center justify-between gap-2">' +
              '<span class="font-mono text-xs text-zinc-400">' + esc(link.code) + '</span>' +
              '<span class="text-sm text-zinc-300 tabular-nums">' + link.joins + (link.joins === 1 ? ' join' : ' joins') + '</span>' +
              '</div>' + who + '</div>';
          }).join('');
          html += '<article class="rounded-2xl border border-zinc-800 bg-zinc-900/60 p-4">' +
            '<div class="flex items-center justify-between gap-3">' +
            '<div class="flex items-center gap-2.5 min-w-0">' + rank +
            '<span class="font-semibold truncate">@' + esc(inv.username) + '</span>' +
            '</div>' +
            '<div class="text-right shrink-0">' +
            '<span class="text-lg font-bold tabular-nums">' + inv.total + '</span>' +
            '<span class="block text-xs text-zinc-500">' + (inv.total === 1 ? 'join' : 'joins') + '</span>' +
            '</div></div>' + links + '</article>';
        });
        el.innerHTML = html;
      }

      // ---------------------------------------------------------- my invites
      function renderMine(links) {
        var el = $('view-mine');
        if (!links.length) {
          el.innerHTML =
            '<div class="rounded-2xl border border-zinc-800 bg-zinc-900/60 p-6 text-center flex flex-col gap-3">' +
            '<p class="font-semibold text-zinc-100">No invite links yet</p>' +
            '<p class="text-sm text-zinc-400">Create a link, share it, and your joins show up here.</p>' +
            '<button type="button" class="self-center rounded-xl bg-violet-600 hover:bg-violet-500 text-white font-semibold px-4 py-2 text-sm" data-open-create>Create invite link</button>' +
            '</div>';
          return;
        }
        var html = '';
        links.forEach(function (link) {
          var dot = link.active ? 'bg-green-500' : 'bg-zinc-600';
          var status = link.active ? 'Active' : (daysLeft(link.expiresAt) !== null && daysLeft(link.expiresAt) <= 0 ? 'Expired' : 'Used up');
          var pct = link.maxUses == null ? 0 : Math.min(100, Math.round((link.joins / link.maxUses) * 100));
          var bar = link.maxUses == null ? '' :
            '<div class="h-1.5 rounded-full bg-zinc-800 mt-3 overflow-hidden">' +
            '<div class="h-full rounded-full bg-violet-500" style="width:' + pct + '%"></div></div>';
          html += '<article class="rounded-2xl border border-zinc-800 bg-zinc-900/60 p-4">' +
            '<div class="flex items-center justify-between gap-3">' +
            '<span class="font-mono text-sm font-semibold text-violet-300 truncate">' + esc(link.code) + '</span>' +
            '<button type="button" class="shrink-0 rounded-lg border border-zinc-700 bg-zinc-800 text-zinc-200 text-xs font-semibold px-3 py-1.5" data-copy="' + esc(link.code) + '">Copy link</button>' +
            '</div>' +
            '<div class="flex items-center gap-2 mt-2.5 text-xs text-zinc-400">' +
            '<span class="w-1.5 h-1.5 rounded-full ' + dot + '"></span><span>' + status + '</span>' +
            '<span aria-hidden="true">·</span><span>' + usesText(link) + '</span>' +
            '<span aria-hidden="true">·</span><span data-expires-at="' + esc(link.expiresAt || '') + '">' + expiryText(link) + '</span>' +
            '</div>' + bar +
            (link.joins
              ? '<p class="text-xs text-zinc-600 mt-2.5">' + link.joins + (link.joins === 1 ? ' person joined' : ' people joined') + ': ' + link.invitees.map(function (n) { return '@' + esc(n); }).join(', ') + '</p>'
              : '<p class="text-xs text-zinc-600 mt-2.5">No joins yet</p>') +
            '</article>';
        });
        el.innerHTML = html;
      }

      // Live countdown: re-render my links from the last successful load so
      // the expiry text (and status dots) stay current without refetching.
      function tickMine() {
        if (tab === 'mine' && mineLinks && !document.hidden) renderMine(mineLinks);
      }
      function startMineTicker() {
        if (mineTicker) return;
        mineTicker = setInterval(tickMine, 60000);
        tickMine();
      }
      function stopMineTicker() {
        if (mineTicker) { clearInterval(mineTicker); mineTicker = null; }
      }
      document.addEventListener('visibilitychange', function () {
        if (tab !== 'mine') return;
        if (document.hidden) stopMineTicker();
        else startMineTicker();
      });

      // -------------------------------------------------------------- loads
      function loadLeaderboard() {
        return fetch('/api/leaderboard', { headers: headers })
          .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
          .then(function (d) { renderLeaderboard(d.inviters); })
          .catch(function () { errorState('view-leaderboard', 'leaderboard'); });
      }
      function loadMine() {
        return fetch('/api/links', { headers: headers })
          .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
          .then(function (d) { mineLinks = d.links; renderMine(d.links); })
          .catch(function () { mineLinks = null; errorState('view-mine', 'mine'); });
      }
      function reload() { return Promise.all([loadLeaderboard(), loadMine()]); }

      // ------------------------------------------------------- create sheet
      function openCreate() {
        $('form-error').classList.add('hidden');
        $('overlay').classList.remove('hidden');
        $('f-days').focus({ preventScroll: true });
      }
      function closeCreate() { $('overlay').classList.add('hidden'); }

      $('fab').addEventListener('click', openCreate);
      $('overlay').addEventListener('click', function (e) {
        if (e.target.closest('[data-close]')) closeCreate();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeCreate();
      });

      $('create-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var errEl = $('form-error');
        var daysRaw = $('f-days').value.trim();
        var usesRaw = $('f-uses').value.trim();
        var days = daysRaw === '' ? null : Number(daysRaw);
        var uses = usesRaw === '' ? null : Number(usesRaw);
        if (days !== null && (!Number.isInteger(days) || days < 1 || days > 365)) {
          errEl.textContent = 'Days must be between 1 and 365, or empty for never.';
          errEl.classList.remove('hidden');
          return;
        }
        if (uses !== null && (!Number.isInteger(uses) || uses < 1 || uses > 9999)) {
          errEl.textContent = 'Max uses must be between 1 and 9999, or empty for unlimited.';
          errEl.classList.remove('hidden');
          return;
        }
        var btn = $('create-btn');
        btn.disabled = true;
        btn.textContent = 'Creating…';
        fetch('/api/links', { method: 'POST', headers: headers, body: JSON.stringify({ days: daysRaw === '' ? null : days, maxUses: usesRaw === '' ? null : uses }) })
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) {
            if (!res.ok) throw new Error(res.d.error || 'Could not create the link');
            closeCreate();
            $('f-days').value = '';
            $('f-uses').value = '';
            showTab('mine');
            toast('Link created');
            loadMine();
          })
          .catch(function (err) {
            errEl.textContent = err.message || 'Could not create the link. Try again.';
            errEl.classList.remove('hidden');
          })
          .then(function () {
            btn.disabled = false;
            btn.textContent = 'Create link';
          });
      });

      // Card actions (copy, empty-state create, retry) via delegation.
      document.addEventListener('click', function (e) {
        var copyBtn = e.target.closest('[data-copy]');
        if (copyBtn) {
          var code = copyBtn.getAttribute('data-copy');
          var link = { code: code };
          copyLink(link);
          return;
        }
        if (e.target.closest('[data-open-create]')) { openCreate(); return; }
        var retry = e.target.closest('[data-retry]');
        if (retry) {
          if (retry.getAttribute('data-retry') === 'mine') loadMine();
          else loadLeaderboard();
        }
      });

      // --------------------------------------------------------------- join
      // Opening the app with ?invite=CODE records the join for this user,
      // once ever, server-side. The param is then cleaned from the URL so a
      // reload cannot replay it.
      function handleInvite() {
        var invite = params.get('invite');
        if (!invite) return Promise.resolve();
        return fetch('/api/join', { method: 'POST', headers: headers, body: JSON.stringify({ code: invite }) })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) {
            if (!d) { toast('This invite could not be checked'); return; }
            if (d.joined) toast('Welcome! You joined via @' + d.inviter);
            else if (d.reason === 'self') toast('This is your own invite link');
            else if (d.reason === 'already') toast('You already joined via an invite');
            else if (d.reason === 'inactive') toast('This invite is no longer active');
            else toast('This invite does not exist');
          })
          .catch(function () { toast('This invite could not be checked'); })
          .then(function () {
            params.delete('invite');
            history.replaceState(null, '', location.pathname + (params.toString() ? '?' + params : ''));
          });
      }

      // ---------------------------------------------------------------- boot
      // Read the create flag before showTab rewrites the URL (it drops
      // transient params), then open the form after the initial render.
      var wantsCreate = params.get('create') === '1';
      showTab(tab);
      handleInvite().then(reload);

      // Open the create form directly when linked as ?create=1
      // (share/deep-link entry point for the form).
      if (wantsCreate) openCreate();
    })();
  </script>
</body>
</html>
